[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-optimization"
version = "0.1.0"
dependencies = ["numpy", "scipy", "matplotlib", "pandas", "qiskit", "pylatexenc", "scikit-learn", "jinja2", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
